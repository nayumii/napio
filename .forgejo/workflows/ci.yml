name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      image: golang:1.25
    steps:
      # actions/checkout is a JavaScript action: the runner executes it with a
      # node binary taken from inside the job container, and golang:1.25 has no
      # node. Check out with git so the job needs nothing but the Go image.
      - name: Check out the repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q .
          git fetch -q --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/napio

      - name: Validate the example configuration
        env:
          FACTORIO_RCON_PASSWORD: ci
          NAPIO_API_TOKEN: ci
        run: go run ./cmd/napio -config examples/napio.yaml -check
