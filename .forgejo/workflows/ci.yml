name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      image: golang:1.25
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/napio

      - name: Validate the example configuration
        env:
          FACTORIO_RCON_PASSWORD: ci
          NAPIO_API_TOKEN: ci
        run: go run ./cmd/napio -config examples/napio.yaml -check
